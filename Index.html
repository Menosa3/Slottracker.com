<!doctype html>
<html>
  <head>
    <title>Slottracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js')
          .then(function(registration) {
            console.log('Service Worker registered with scope:', registration.scope);
          }).catch(function(error) {
            console.log('Service Worker registration failed:', error);
          });
      }
    </script>
  </head>
  <body>
    <div class="container">
      <h1 class="my-4">Slot Game Tracker</h1>
      <form id="slotDataForm">
        <div class="form-group">
          <label for="game">Game:</label>
          <input type="text" class="form-control" id="game" name="game" required>
        </div>
        <div class="form-group">
          <label for="result">Result:</label>
          <input type="text" class="form-control" id="result" name="result" required>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
      <h2 class="my-4">Tracked Results</h2>
      <ul id="slotDataList" class="list-group"></ul>
    </div>
    <script src="script.js"></script>
  </body>
</html>
